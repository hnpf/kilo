name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install Lua development files
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-dev

      - name: build
        run: make

      - name: upload nightly build
        uses: actions/upload-artifact@v4
        with:
          name: kilo-linux-x86_64
          path: kilo
